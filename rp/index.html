<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>추가작업 동의서 - 리커버리프로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Pretendard GOV";font-weight:400;font-display:swap;src:url(../ok/fonts/PretendardGOV-Regular.subset.woff2) format("woff2")}
@font-face{font-family:"Pretendard GOV";font-weight:500;font-display:swap;src:url(../ok/fonts/PretendardGOV-Medium.subset.woff2) format("woff2")}
@font-face{font-family:"Pretendard GOV";font-weight:700;font-display:swap;src:url(../ok/fonts/PretendardGOV-Bold.subset.woff2) format("woff2")}
:root{--g90:#1e2124;--g70:#464c53;--g50:#6d7882;--g30:#b1b8be;--g20:#cdd1d5;--g10:#e6e8ea;--g5:#f4f5f6;--pri:#2b6b3e;--pri-d:#1f5130;--pri-bg:#eef6f0;--focus:#256ef4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--g5);color:var(--g90);font-family:"Pretendard GOV",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
.paper{max-width:560px;margin:0 auto;background:#fff;min-height:100vh;padding:26px 18px 40px}
@media(min-width:600px){.paper{margin:24px auto;min-height:auto;border:1px solid var(--g20);padding:36px 34px 44px}}
h1{font-family:"Noto Serif KR",serif;font-size:26px;letter-spacing:6px;text-align:center;margin:4px 0 4px;padding-bottom:10px;border-bottom:3px double #333}
.no{text-align:right;font-size:12px;color:var(--g50);margin:6px 0 18px}
.lead{font-size:17px;line-height:1.75;margin:0 0 16px}
table{width:100%;border-collapse:collapse;font-size:15px;margin:0 0 14px}
th,td{border:1px solid var(--g30);padding:9px 10px;vertical-align:middle;line-height:1.5}
th{background:var(--g5);font-weight:600;white-space:nowrap;text-align:center;width:26%}
.list th{width:auto}
.list td.n{text-align:center;width:42px;color:var(--g70)}
.list td.a{text-align:right;white-space:nowrap;width:30%}
.list tr.sum td{background:var(--g5);font-weight:700}
.box{border:1px solid var(--g20);background:#fbfbfc;padding:12px 14px;font-size:14.5px;line-height:1.7;margin:0 0 18px}
.box p{margin:0}
.box p+p{margin-top:6px}
.agree{border-top:1px solid #333;padding-top:18px;text-align:center}
.agree .s{font-size:16px;margin:0 0 6px}
.agree .d{font-size:15px;color:var(--g70);margin:0 0 14px}
.name{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 16px;font-size:16px}
.name input{width:150px;font:inherit;font-size:17px;padding:8px 10px;border:0;border-bottom:2px solid #333;text-align:center;outline:none;background:transparent}
.btn{display:block;width:100%;border:0;border-radius:8px;background:var(--pri);color:#fff;font:inherit;font-size:18px;font-weight:700;padding:15px;cursor:pointer}
.btn:disabled{background:var(--g20)}
.sub{font-size:13px;color:var(--g50);margin:10px 0 0;line-height:1.6}
.co{margin-top:26px;text-align:center;font-size:15px;line-height:1.7}
.co b{font-size:17px}
.co a{color:var(--g90)}
.done{display:none;border:2px solid var(--pri);background:var(--pri-bg);padding:16px;text-align:center;font-size:16px;line-height:1.7}
.done b{color:var(--pri);font-size:19px}
.err{color:#b3261e;font-size:14px;min-height:20px;margin:8px 0 0}
.bad{padding:60px 10px;text-align:center;font-size:16px;line-height:1.8}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
.btn{min-height:56px;font-size:19px!important;letter-spacing:-.2px}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
body.rp{--pri:#1f3864;--pri-d:#162a4d;--pri-bg:#eef2f9}
</style>
</head>
<body>
<div class="paper" id="app"><div class="bad">불러오는 중…</div></div>
<script>
const API='https://evergreen-proxy-git-main-evergreen-s-projects1.vercel.app/api/consent';
const TYPES={add:'추가 작업',found:'새로 확인된 부분',upgrade:'사양 업그레이드'};
const LEAD={
  add:'요청하신 아래 작업을 처음 계약한 작업에 더해 진행합니다.',
  found:'작업 중에 처음 견적 때는 확인할 수 없었던 부분이 나와, 아래 작업이 추가로 필요합니다.',
  upgrade:'요청하신 대로 아래 항목을 처음 계약보다 높은 사양으로 바꿔 진행합니다.'
};
const BRAND={eg:{n:'특수청소에버그린'},rp:{n:'주식회사 리커버리프로'}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>(Number(n)||0).toLocaleString('ko-KR')+'원';
const ymd=ms=>{const d=new Date(ms);return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일'};
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
const q=new URLSearchParams(location.hash.slice(1));
const P=q.get('p'),S=q.get('s');
const app=document.getElementById('app');
let D=null;
try{D=JSON.parse(b64d(P||''))}catch(e){}
if(!D||!S){app.innerHTML='<div class="bad">확인할 수 없는 링크입니다.<br>담당자에게 다시 받아 주세요.<br><br>문의 <a href="tel:16682412">1668-2412</a></div>'}
else{
  const B=BRAND[D.b]||BRAND.eg;if(D.b==='rp')document.body.classList.add('rp');
  const total=D.items.reduce((s,i)=>s+(Number(i.amt)||0),0);
  const rows=D.items.map((it,i)=>`<tr><td class="n">${i+1}</td><td>${esc(it.desc)}</td><td class="a">${won(it.amt)}</td></tr>`).join('');
  const doneKey='ok_'+D.id;
  let prev=null;try{prev=localStorage.getItem(doneKey)}catch(e){}
  app.innerHTML=`
  <h1>추가작업 동의서</h1>
  <p class="no">No. ${esc(D.id)} · ${ymd(D.at)} 작성</p>
  <p class="lead">${esc(D.cust)} 고객님, ${LEAD[D.t]||LEAD.add} 내용을 확인하시고 동의해 주세요.</p>
  <table>
    <tr><th>구분</th><td>${TYPES[D.t]||'추가 작업'}</td></tr>
    <tr><th>현장</th><td>${esc(D.site)||'-'}</td></tr>
    <tr><th>담당자</th><td>${esc(D.staff)||'-'}</td></tr>
  </table>
  <table class="list">
    <tr><th>번호</th><th>내용</th><th>금액</th></tr>
    ${rows}
    <tr class="sum"><td colspan="2" style="text-align:center">추가 금액 합계</td><td class="a">${won(total)}</td></tr>
  </table>
  ${D.note?`<div class="box"><p>${esc(D.note)}</p></div>`:''}
  <div class="box">
    <p>· 부가세 포함 여부와 정산 방법은 처음 계약과 같습니다.</p>
    <p>· 추가 금액도 <b>작업이 끝난 뒤 결제(후불)</b>, <b>나눠서 내기(분할납부)</b>가 가능합니다.</p>
    <p>· 동의하지 않으시면 이 추가 작업은 진행하지 않습니다.</p>
  </div>
  <div class="agree" id="agreeBox">
    <p class="s">위 내용을 확인하였으며 추가 작업에 동의합니다.</p>
    <p class="d">${ymd(Date.now())}</p>
    <div class="name">동의인 <input id="nm" value="${esc(D.cust)}" autocomplete="name" aria-label="동의인 성함"> (인)</div>
    <button class="btn" id="go">동의합니다</button>
    <p class="err" id="err"></p>
    <p class="sub">[동의합니다]를 누르면 동의 시각과 내용이 기록되어 담당자에게 전달됩니다.</p>
  </div>
  <div class="done" id="done"></div>
  <div class="co"><b>${B.n}</b><br>대표 김현섭 (인)<br>문의 <a href="tel:16682412">1668-2412</a> · <a href="tel:01084990024">010-8499-0024</a></div>`;
  const showDone=(when)=>{document.getElementById('agreeBox').style.display='none';const d=document.getElementById('done');d.style.display='block';d.innerHTML=`<b>동의가 완료되었습니다</b><br>${esc(when)}<br>이 화면을 캡처해 두셔도 됩니다.`};
  if(prev)showDone(prev);
  document.getElementById('go').onclick=async()=>{
    const btn=document.getElementById('go'),err=document.getElementById('err'),name=document.getElementById('nm').value.trim();
    err.textContent='';
    if(!name){err.textContent='성함을 적어 주세요.';return}
    btn.disabled=true;btn.textContent='기록하는 중…';
    try{
      const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'agree',p:P,s:S,name})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.ok)throw new Error(j.error||'잠시 후 다시 눌러 주세요.');
      const when='동의 시각 '+j.when;
      try{localStorage.setItem(doneKey,when)}catch(e){}
      showDone(when);
    }catch(e){err.textContent=e.message;btn.disabled=false;btn.textContent='동의합니다'}
  };
}
</script>
</body>
</html>
